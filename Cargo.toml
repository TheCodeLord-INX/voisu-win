[package]
name = "voisu-win"
version = "0.1.0"
edition = "2024"
authors = ["Voisu Team"]
description = "Ultra-low-latency dual-engine speech-to-text dictation client for Windows"

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization & CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

# Audio Pipeline
cpal = "0.15"
rubato = "0.16"
hound = "3.5"

# Networking & STT Providers
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Windows Native APIs
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
] }

# Utilities
regex = "1.11"
dirs = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.17"
